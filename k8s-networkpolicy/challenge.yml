---
apiVersion: v1
kind: Pod
metadata:
  name: trusted
  namespace: backend
  labels:
    access: kuard
spec:
  containers:
    - name: client
      image: busybox:1.37
      command: ["sleep", "infinity"]
      livenessProbe:
        exec:
          command: ["true"]
      readinessProbe:
        exec:
          command: ["true"]
      resources:
        limits:
          memory: 32Mi
          cpu: "0.1"
        requests:
          memory: 16Mi
          cpu: "0.05"
---
apiVersion: v1
kind: Pod
metadata:
  name: untrusted
  namespace: backend
spec:
  containers:
    - name: client
      image: busybox:1.37
      command: ["sleep", "infinity"]
      livenessProbe:
        exec:
          command: ["true"]
      readinessProbe:
        exec:
          command: ["true"]
      resources:
        limits:
          memory: 32Mi
          cpu: "0.1"
        requests:
          memory: 16Mi
          cpu: "0.05"
